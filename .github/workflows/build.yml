name: Build NekoYgg

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      publish_release:
        type: boolean
        default: true
    outputs:
      version_name:
        value: ${{ jobs.build.outputs.version_name }}
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release for this build"
        type: boolean
        default: true

permissions:
  contents: write

env:
  ANDROID_PLATFORM: "android-37.0"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.build.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      - name: Set up Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          link-to-sdk: true
      - run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Build core + APKs
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: bash scripts/build-and-package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoYgg-${{ steps.build.outputs.version_name }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version_name }}
          name: NekoYgg ${{ steps.build.outputs.version_name }}
          files: dist/*.apk
